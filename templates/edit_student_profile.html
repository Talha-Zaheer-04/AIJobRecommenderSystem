{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <i class="fas fa-user-edit fa-2x mb-2"></i>
                    <h3 class="mb-0">Edit Student Profile</h3>
                    <p class="mb-0 mt-1 small opacity-75">Update your personal information</p>
                </div>
                
                <div class="card-body p-4">
                    <form method="POST">
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">
                                <i class="fas fa-user text-primary"></i> Full Name <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control" id="name" name="name" 
                                       value="{{ user.name }}" required placeholder="Enter your full name">
                            </div>
                        </div>
                        
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">
                                <i class="fas fa-envelope text-primary"></i> Email <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ user.email }}" required placeholder="student@example.com">
                            </div>
                            <small class="text-muted">This email will be used for login</small>
                        </div>
                        
                        <!-- Degree -->
                        <div class="mb-3">
                            <label for="degree" class="form-label fw-semibold">
                                <i class="fas fa-graduation-cap text-primary"></i> Degree
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-graduation-cap"></i>
                                </span>
                                <input type="text" class="form-control" id="degree" name="degree" 
                                       value="{{ user.degree or '' }}" placeholder="e.g., Computer Science, Data Science">
                            </div>
                        </div>
                        
                        <!-- CGPA & Graduation Year -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="cgpa" class="form-label fw-semibold">
                                    <i class="fas fa-star text-primary"></i> CGPA
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="fas fa-chart-line"></i>
                                    </span>
                                    <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" 
                                           value="{{ user.cgpa or '' }}" placeholder="0.00 - 4.00" min="0" max="4">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="graduation_year" class="form-label fw-semibold">
                                    <i class="fas fa-calendar text-primary"></i> Graduation Year
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="fas fa-calendar"></i>
                                    </span>
                                    <input type="number" class="form-control" id="graduation_year" name="graduation_year" 
                                           value="{{ user.graduation_year or '' }}" placeholder="e.g., 2025" min="2020" max="2030">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Info Alert -->
                        <div class="alert alert-info py-2 mb-4">
                            <i class="fas fa-info-circle"></i>
                            <small>Your profile information helps employers find you. Keep it up to date!</small>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border-radius: 16px;
        overflow: hidden;
    }
    
    .card-header {
        background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
    }
    
    .input-group-text {
        border-radius: 10px 0 0 10px;
        min-width: 42px;
        justify-content: center;
    }
    
    .form-control {
        border-radius: 0;
    }
    
    .input-group .form-control:last-child {
        border-radius: 0 10px 10px 0;
    }
    
    .btn {
        border-radius: 10px;
        font-weight: 500;
        padding: 12px;
    }
    
    .btn-lg {
        font-size: 1rem;
    }
    
    .alert {
        border-radius: 10px;
        border: none;
    }
    
    .bg-light {
        background-color: #f8f9fa !important;
    }
    
    @media (max-width: 768px) {
        .card-body {
            padding: 1.5rem !important;
        }
    }
</style>
{% endblock %}
