{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-danger text-white text-center py-3">
                    <h3 class="mb-0">
                        <i class="fas fa-key"></i> Change Password
                    </h3>
                    <p class="mb-0 mt-1 small opacity-75">
                        <i class="fas fa-shield-alt"></i> Keep your account secure
                    </p>
                </div>
                
                <div class="card-body p-4">
                    <form method="POST" onsubmit="return validatePassword()">
                        <!-- Current Password -->
                        <div class="mb-4">
                            <label for="current_password" class="form-label fw-semibold">
                                <i class="fas fa-lock"></i> Current Password
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-key"></i>
                                </span>
                                <input type="password" class="form-control" id="current_password" 
                                       name="current_password" required placeholder="Enter your current password">
                                <button class="btn btn-outline-secondary" type="button" 
                                        onclick="togglePassword('current_password', this)">
                                    <i class="fas fa-eye"></i> Show
                                </button>
                            </div>
                        </div>
                        
                        <!-- New Password -->
                        <div class="mb-4">
                            <label for="new_password" class="form-label fw-semibold">
                                <i class="fas fa-lock"></i> New Password
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-plus-circle"></i>
                                </span>
                                <input type="password" class="form-control" id="new_password" 
                                       name="new_password" required placeholder="Enter new password (min 4 characters)">
                                <button class="btn btn-outline-secondary" type="button" 
                                        onclick="togglePassword('new_password', this)">
                                    <i class="fas fa-eye"></i> Show
                                </button>
                            </div>
                            <small class="text-muted">
                                <i class="fas fa-info-circle"></i> Minimum 4 characters required
                            </small>
                        </div>
                        
                        <!-- Confirm New Password -->
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold">
                                <i class="fas fa-check-circle"></i> Confirm New Password
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-check"></i>
                                </span>
                                <input type="password" class="form-control" id="confirm_password" 
                                       name="confirm_password" required placeholder="Confirm new password">
                                <button class="btn btn-outline-secondary" type="button" 
                                        onclick="togglePassword('confirm_password', this)">
                                    <i class="fas fa-eye"></i> Show
                                </button>
                            </div>
                            <div id="passwordMatch" class="mt-1">
                                <small class="text-muted">
                                    <i class="fas fa-info-circle"></i> Passwords must match
                                </small>
                            </div>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="fas fa-save"></i> Change Password
                            </button>
                            {% if user_type == 'student' %}
                                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                                </a>
                            {% else %}
                                <a href="{{ url_for('company_profile') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left"></i> Back to Profile
                                </a>
                            {% endif %}
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Toggle password visibility
function togglePassword(fieldId, button) {
    const field = document.getElementById(fieldId);
    const type = field.getAttribute('type') === 'password' ? 'text' : 'password';
    field.setAttribute('type', type);
    
    const icon = button.querySelector('i');
    if (type === 'password') {
        icon.className = 'fas fa-eye';
        button.innerHTML = '<i class="fas fa-eye"></i> Show';
    } else {
        icon.className = 'fas fa-eye-slash';
        button.innerHTML = '<i class="fas fa-eye-slash"></i> Hide';
    }
}

// Validate password length and match before submit
function validatePassword() {
    const newPass = document.getElementById('new_password').value;
    const confirmPass = document.getElementById('confirm_password').value;
    const matchDiv = document.getElementById('passwordMatch');
    
    // Check minimum length
    if (newPass.length < 4) {
        alert('Password must be at least 4 characters long!');
        return false;
    }
    
    // Check if passwords match
    if (newPass !== confirmPass) {
        matchDiv.innerHTML = '<small class="text-danger"><i class="fas fa-exclamation-triangle"></i> Passwords do not match!</small>';
        return false;
    }
    
    return true;
}

// Real-time password match check
document.getElementById('confirm_password').addEventListener('keyup', function() {
    const newPass = document.getElementById('new_password').value;
    const confirmPass = this.value;
    const matchDiv = document.getElementById('passwordMatch');
    
    if (newPass === confirmPass && confirmPass.length > 0) {
        matchDiv.innerHTML = '<small class="text-success"><i class="fas fa-check-circle"></i> Passwords match!</small>';
    } else if (confirmPass.length > 0) {
        matchDiv.innerHTML = '<small class="text-danger"><i class="fas fa-exclamation-triangle"></i> Passwords do not match!</small>';
    } else {
        matchDiv.innerHTML = '<small class="text-muted"><i class="fas fa-info-circle"></i> Passwords must match</small>';
    }
});

// Also check when new password changes (to reset match message)
document.getElementById('new_password').addEventListener('keyup', function() {
    const confirmPass = document.getElementById('confirm_password').value;
    const matchDiv = document.getElementById('passwordMatch');
    
    if (confirmPass.length > 0) {
        const newPass = this.value;
        if (newPass === confirmPass) {
            matchDiv.innerHTML = '<small class="text-success"><i class="fas fa-check-circle"></i> Passwords match!</small>';
        } else {
            matchDiv.innerHTML = '<small class="text-danger"><i class="fas fa-exclamation-triangle"></i> Passwords do not match!</small>';
        }
    }
});
</script>

<style>
    .card {
        border-radius: 16px;
        overflow: hidden;
    }
    .input-group-text {
        border-radius: 10px 0 0 10px;
    }
    .form-control {
        border-radius: 0;
    }
    .input-group .btn {
        border-radius: 0 10px 10px 0;
    }
    .btn {
        border-radius: 10px;
        font-weight: 500;
    }
    .btn-lg {
        padding: 12px;
    }
    .alert-info {
        background-color: #e7f3ff;
        border: none;
        color: #0c5460;
    }
</style>
{% endblock %}
