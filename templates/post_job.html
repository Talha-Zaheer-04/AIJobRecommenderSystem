{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white text-center py-3">
                    <h3 class="mb-0">
                        <i class="fas fa-plus-circle"></i> Post a New Job
                    </h3>
                    <p class="mb-0 mt-1 small opacity-75">Create a new job posting to find the best candidates</p>
                </div>
                
                <div class="card-body p-4">
                    <form method="POST">
                        <!-- Job Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">
                                <i class="fas fa-tag text-primary"></i> Job Title <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-briefcase"></i>
                                </span>
                                <input type="text" class="form-control" id="title" name="title" 
                                       required placeholder="e.g., Senior Python Developer">
                            </div>
                        </div>
                        
                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">
                                <i class="fas fa-file-alt text-primary"></i> Description <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" id="description" name="description" 
                                      rows="5" required placeholder="Describe the job responsibilities, requirements, benefits, and other details..."></textarea>
                            <small class="text-muted">Provide a clear and detailed job description to attract quality candidates</small>
                        </div>
                        
                        <!-- Experience & Salary -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="min_experience" class="form-label fw-semibold">
                                    <i class="fas fa-clock text-primary"></i> Min Experience
                                </label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="min_experience" 
                                           name="min_experience" value="0" min="0">
                                    <span class="input-group-text">years</span>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label for="salary_min" class="form-label fw-semibold">
                                    <i class="fas fa-dollar-sign text-primary"></i> Min Salary
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="salary_min" 
                                           name="salary_min" placeholder="e.g., 50000" min="0">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label for="salary_max" class="form-label fw-semibold">
                                    <i class="fas fa-dollar-sign text-primary"></i> Max Salary
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="salary_max" 
                                           name="salary_max" placeholder="e.g., 80000" min="0">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Required Skills -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="fas fa-code text-primary"></i> Required Skills
                            </label>
                            <div id="skills-container" class="border rounded p-3 bg-light">
                                <div class="row mb-2 skill-row align-items-center">
                                    <div class="col-md-7">
                                        <input type="text" name="skills" class="form-control form-control-sm" 
                                               placeholder="e.g., Python" required>
                                    </div>
                                    <div class="col-md-4">
                                        <select name="importance_weights" class="form-select form-select-sm" required>
                                            <option value="">Select importance</option>
                                            <option value="1">1 - Low Importance (Nice to have)</option>
                                            <option value="2">2 - Basic (Basic knowledge)</option>
                                            <option value="3" selected>3 - Medium (Important)</option>
                                            <option value="4">4 - High (Very important)</option>
                                            <option value="5">5 - Critical (Must have)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-1">
                                        <button type="button" class="btn btn-danger btn-sm remove-skill w-100">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" id="add-skill" class="btn btn-sm btn-outline-primary mt-2">
                                <i class="fas fa-plus"></i> Add Another Skill
                            </button>
                            <small class="text-muted d-block mt-1">
                                <i class="fas fa-info-circle"></i> Add all the skills required for this job and set their importance level
                            </small>
                        </div>
                        
                        <hr class="my-4">
                        
                        <!-- Action Buttons -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-paper-plane"></i> Post Job
                            </button>
                            <a href="{{ url_for('company_jobs') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Add new skill row
    document.getElementById('add-skill').addEventListener('click', function() {
        const container = document.getElementById('skills-container');
        const newRow = document.createElement('div');
        newRow.className = 'row mb-2 skill-row align-items-center';
        newRow.innerHTML = `
            <div class="col-md-7">
                <input type="text" name="skills" class="form-control form-control-sm" 
                       placeholder="e.g., Django" required>
            </div>
            <div class="col-md-4">
                <select name="importance_weights" class="form-select form-select-sm" required>
                    <option value="">Select importance</option>
                    <option value="1">1 - Low Importance (Nice to have)</option>
                    <option value="2">2 - Basic (Basic knowledge)</option>
                    <option value="3" selected>3 - Medium (Important)</option>
                    <option value="4">4 - High (Very important)</option>
                    <option value="5">5 - Critical (Must have)</option>
                </select>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-danger btn-sm remove-skill w-100">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
        container.appendChild(newRow);
        
        newRow.querySelector('.remove-skill').addEventListener('click', function() {
            newRow.remove();
        });
    });
    
    // Remove skill row
    document.querySelectorAll('.remove-skill').forEach(btn => {
        btn.addEventListener('click', function() {
            this.closest('.skill-row').remove();
        });
    });
</script>

<style>
    .card {
        border-radius: 16px;
        overflow: hidden;
    }
    .input-group-text {
        border-radius: 10px 0 0 10px;
    }
    .form-control, .form-select {
        border-radius: 0;
    }
    .input-group .form-control:last-child, 
    .input-group .form-select:last-child {
        border-radius: 0 10px 10px 0;
    }
    .btn {
        border-radius: 10px;
        font-weight: 500;
    }
    .btn-lg {
        padding: 12px;
        font-size: 1rem;
    }
    .bg-light {
        background-color: #f8f9fa !important;
    }
    .skill-row {
        transition: background-color 0.2s ease;
        padding: 5px;
        border-radius: 8px;
    }
    .skill-row:hover {
        background-color: rgba(0, 0, 0, 0.02);
    }
    textarea {
        resize: vertical;
    }
</style>
{% endblock %}
